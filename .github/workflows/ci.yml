name: Qook CI

on:
  pull_request:
    branches: [main, phase3a-wiring]
  push:
    branches: [main, phase3a-wiring, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qook-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.1
      - name: Fetch locked test dependencies
        run: sh scripts/qa/run-backend-tests.sh cache
      - name: Typecheck Edge Functions
        run: sh scripts/qa/run-backend-tests.sh check
      - name: Run backend tests without network access
        run: sh scripts/qa/run-backend-tests.sh test

  native:
    name: Native checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Test native app
        working-directory: apps/native
        run: bun run test
      - name: Typecheck native app
        working-directory: apps/native
        run: bun run typecheck
      - name: Lint native app
        working-directory: apps/native
        run: bun run lint
